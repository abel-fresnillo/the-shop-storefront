name: Branch Guard

on:
  push:
    branches: [main]

jobs:
  prevent-direct-push:
    name: Prevent Direct Pushes to Main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify push came from a pull request merge
        run: |
          PARENT_COUNT=$(git log --pretty=%P -1 HEAD | wc -w)
          if [ "$PARENT_COUNT" -lt 2 ]; then
            echo "::error::Direct pushes to 'main' are not allowed."
            echo "::error::Push your changes to 'development' and open a pull request."
            exit 1
          fi
          echo "Merge commit verified. Proceeding."
